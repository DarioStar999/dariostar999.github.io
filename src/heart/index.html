<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Love U</title>
      <script type="module" crossorigin src="./assets/index-Ct-zQ1A_.js"></script>
      <link rel="stylesheet" crossorigin href="./assets/index-XXtpf4sz.css">
    </head>
    <body>
        <canvas id="scene"></canvas>
        <button id="shareButton" type="button" aria-label="Condividi questo cuore">
            <span aria-hidden="true">&#8599;</span>
            <span>Condividi</span>
        </button>
        <div id="overlay">
            <div class="card">
                <div class="card__glow" aria-hidden="true"></div>
                <div class="card__icon" aria-hidden="true">♡</div>
                <div class="card__heading">
                    <p class="eyebrow">A little something for you</p>
                    <h1>Love U</h1>
                    <p class="subtitle">Crea un cuore unico, con il nome di chi ami.</p>
                </div>
                <label class="input-label" for="nameInp">Il suo nome</label>
                <input id="nameInp" type="text" placeholder="Es. Jessica" autocomplete="name" maxlength="48">
                <div class="theme-picker" role="group" aria-label="Scegli il colore del cuore">
                    <button class="theme-swatch is-selected" type="button" data-theme="red" aria-label="Tema rosso"></button>
                    <button class="theme-swatch theme-swatch--pink" type="button" data-theme="pink" aria-label="Tema rosa"></button>
                    <button class="theme-swatch theme-swatch--violet" type="button" data-theme="violet" aria-label="Tema viola"></button>
                    <button class="theme-swatch theme-swatch--ocean" type="button" data-theme="ocean" aria-label="Tema oceano"></button>
                    <button class="theme-swatch theme-swatch--sunset" type="button" data-theme="sunset" aria-label="Tema tramonto"></button>
                    <button class="theme-swatch theme-swatch--mint" type="button" data-theme="mint" aria-label="Tema menta"></button>
                    <button class="theme-swatch theme-swatch--gold" type="button" data-theme="gold" aria-label="Tema oro"></button>
                    <button class="theme-swatch theme-swatch--ruby" type="button" data-theme="ruby" aria-label="Tema rubino"></button>
                    <button class="theme-swatch theme-swatch--midnight" type="button" data-theme="midnight" aria-label="Tema notte"></button>
                    <button class="theme-swatch theme-swatch--aurora" type="button" data-theme="aurora" aria-label="Tema aurora"></button>
                </div>
                <button id="createButton">
                    <span>Crea il tuo cuore</span>
                    <span aria-hidden="true">→</span>
                </button>
                <p class="card__hint">Un gesto semplice, fatto con il cuore.</p>
            </div>
        </div>
    </body>
</html>
