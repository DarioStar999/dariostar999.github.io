<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main Page Moderna · Due Pulsanti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 30% 10%, #0c0f24, #030514);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f0f0ff;
      line-height: 1.5;
      padding: 1rem;
    }

    /* contenitore principale con effetto glass */
    .main-card {
      max-width: 900px;
      width: 100%;
      background: rgba(15, 25, 45, 0.4);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 3rem;
      padding: 4rem 3rem;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 0, 0.1) inset;
      text-align: center;
      transition: box-shadow 0.3s;
      animation: float 8s ease-in-out infinite;
    }

    .main-card:hover {
      box-shadow: 0 40px 80px -15px #ffd96633, 0 0 0 1px #ffd96655 inset;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 4.2rem);
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff, #ffe28c, #ffb347);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
      filter: drop-shadow(0 4px 6px #00000055);
    }

    .subtitle {
      font-size: 1.3rem;
      color: #b8c7ff;
      margin-bottom: 3rem;
      border-bottom: 1px dashed #ffd96655;
      padding-bottom: 1.2rem;
      display: inline-block;
    }

    /* container pulsanti */
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
      margin-top: 2.5rem;
    }

    /* stile base pulsanti */
    .btn {
      text-decoration: none;
      padding: 1.2rem 3rem;
      border-radius: 4rem;
      font-weight: 600;
      font-size: 1.5rem;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(10, 20, 40, 0.6);
      backdrop-filter: blur(8px);
      color: white;
      box-shadow: 0 10px 20px -8px black;
      flex: 0 1 auto;
      min-width: 250px;
      border-image: linear-gradient(135deg, #ffd966, #ffaa33) 1;
      border-image-slice: 1;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.6s;
    }

    .btn:hover {
      transform: scale(1.08) translateY(-5px);
      background: rgba(30, 40, 70, 0.8);
      border-color: #ffd966;
      box-shadow: 0 0 30px #ffd96699, 0 15px 25px -10px black;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn i {
      font-size: 1.8rem;
      color: #ffd966;
      transition: transform 0.3s;
    }

    .btn:hover i {
      transform: rotate(10deg) scale(1.1);
    }

    /* effetto glow aggiuntivo al posto del focus */
    .btn:active {
      transform: scale(1.02);
    }

    /* sfondo animato sottile (opzionale) */
    .bg-bubble {
      position: fixed;
      top: -20%;
      left: -10%;
      width: 60%;
      height: 80%;
      background: radial-gradient(circle at 30% 50%, #ffd96622, transparent 60%);
      filter: blur(60px);
      z-index: -1;
      animation: moveBubble 18s infinite alternate ease-in-out;
    }

    .bg-bubble2 {
      top: auto;
      bottom: -10%;
      right: -5%;
      left: auto;
      width: 70%;
      height: 70%;
      background: radial-gradient(circle at 70% 80%, #a56eff22, transparent 70%);
      animation: moveBubble2 22s infinite alternate;
    }

    @keyframes moveBubble {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(8%, 10%) scale(1.2); }
    }
    @keyframes moveBubble2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-10%, -8%) scale(1.3); }
    }

    /* responsività */
    @media (max-width: 600px) {
      .main-card {
        padding: 2.5rem 1.5rem;
      }
      .btn {
        font-size: 1.2rem;
        padding: 1rem 2rem;
        min-width: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-bubble"></div>
  <div class="bg-bubble bg-bubble2"></div>

  <div class="main-card">
    <h1>Benvenuto</h1>
    <div class="subtitle">Scegli la tua destinazione</div>

    <div class="buttons">
      <a href="https://dariostar999.github.io/src/nike/index.html" target="_blank" rel="noopener noreferrer" class="btn">
        <i class="fab fa-nikeclient"></i> NikeClient
      </a>
      <a href="https://dariostar999.github.io/src/wheel/wheel.html" target="_blank" rel="noopener noreferrer" class="btn">
        <i class="fab fa-SpinWheel"></i> Spin Wheel
      </a>
    </div>

    <p style="margin-top: 3rem; color: #9aa9d5; font-size: 0.95rem; border-top: 1px solid #ffffff1a; padding-top: 1.5rem;">
      <i class="fas fa-mouse-pointer" style="margin-right: 6px;"></i> Passa il mouse sui pulsanti per vedere gli effetti
    </p>
  </div>
</body>
</html>
